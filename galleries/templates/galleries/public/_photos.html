{% for photo in photos %}<a class="tile" href="{{ photo.viewer.url }}" data-photo="{{ photo.id }}" data-w="{{ photo.viewer.width }}" data-h="{{ photo.viewer.height }}"{% if is_preview or photo.id in owned %} data-download="{% url 'public-photo-download' gallery.public_token photo.id %}"{% endif %}><img src="{{ photo.thumb.url }}" width="{{ photo.thumb.width }}" height="{{ photo.thumb.height }}" alt="Photo {{ page.start_index|add:forloop.counter0 }} of {{ photo_count }}" {% if page.number == 1 and forloop.counter <= 6 %}loading="eager"{% else %}loading="lazy"{% endif %} decoding="async"></a>
{% endfor %}<span hidden data-next="{% if page.has_next %}?page={{ page.next_page_number }}{% endif %}"></span>
