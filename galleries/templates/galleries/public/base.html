<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}FotoHub{% endblock %}</title>
{% block meta %}{% endblock %}
<style>
:root {
  --accent: {{ profile.brand_color|default:"#172033" }};
  --bg: #f7f5f1; --surface: #ffffff; --text: #1d1c1a; --muted: #6b665e; --line: #e4dfd6;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121110; --surface: #1c1b19; --text: #f1eee8; --muted: #a39d93; --line: #2e2c28; }
}
* { box-sizing: border-box; }
/* Author display rules (e.g. .btn's inline-flex) would otherwise unhide [hidden] elements. */
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); }
a { color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px;
  border: 0; border-radius: 999px; background: var(--accent); color: #fff;
  font: 600 15px/1 var(--sans); text-decoration: none; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.btn:focus-visible, a:focus-visible, input:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
.banner { background: #fff3c4; color: #3d3300; font-size: 14px; padding: 10px 16px; text-align: center; }
.eyebrow { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
h1 { font: 400 clamp(32px, 6vw, 56px)/1.1 var(--serif); margin: 8px 0; letter-spacing: -.01em; }
.center { min-height: 100svh; display: grid; place-items: center; padding: 32px 16px; text-align: center; }
.card { width: 100%; max-width: 420px; }
.muted { color: var(--muted); }
.footer { padding: 40px 16px 56px; text-align: center; color: var(--muted); font-size: 13px; }
{% block style %}{% endblock %}
</style>
</head>
<body>
{% if is_preview %}<div class="banner" role="status">{% include "galleries/public/_preview_note.html" %}</div>{% endif %}
{% block body %}{% endblock %}
</body>
</html>
