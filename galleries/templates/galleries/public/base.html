{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}{{ brand_name }}{% endblock %}</title>
<link rel="manifest" href="{% url 'pwa-manifest' %}">
<meta name="theme-color" content="#1e6b34">
<link rel="icon" href="{% static 'galleries/icons/icon-32.png' %}" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="{% static 'galleries/icons/apple-touch-icon.png' %}">
{% block meta %}{% endblock %}
<style nonce="{{ csp_nonce }}">
/* Self-hosted fonts (SIL OFL, see the OFL.txt beside them), one variable file each. Inter (48 KB)
   is the reading face: body text, labels, small print. Outfit (32 KB), a free geometric face in
   the spirit of Cocogoose (whose licence rules out a commercial site), sets the wordmark,
   headings and buttons. Guests are often on mobile data, so Inter keeps the weight-only cut. */
@font-face {
  font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap;
  src: url("{% static 'galleries/fonts/inter-latin-wght-normal.woff2' %}") format("woff2");
}
@font-face {
  font-family: "Outfit"; font-style: normal; font-weight: 100 900; font-display: swap;
  src: url("{% static 'galleries/fonts/outfit-latin-wght-normal.woff2' %}") format("woff2");
}
/* School palette (St. Maria Goretti S.S.S Katende's website, 2026-11-02): green #1e6b34 for
   structure, buttons and links (white on it ~6.5:1); gold #f5a623 only for the main "do this"
   action on a page (Open photos, Buy, Pay), always with dark text (~9:1; white on gold is ~2:1);
   charcoal #222 text on white and #f9f9f9. Tints are derived from the green. */
:root {
  --ink: #1e6b34; --text: #222222; --muted: #555555;
  --bg: #f9f9f9; --surface: #ffffff; --line: #e3e3e3;
  --accent: #1e6b34; --accent-ink: #ffffff;
  --cta: #f5a623; --cta-hover: #e59400; --cta-ink: #222222;
  --leaf: #2f8f4a; --lime: #cfe6d6; --sky: #55a6c3; --lime-wash: #eaf4ed;
  --success: #1e6b34; --success-text: #1e6b34; --highlight: #fde3b0; --highlight-ink: #222222;
  --danger: #b42318;
  --field-line: #8a8a8a; /* input outlines need 3:1 against their background (WCAG 1.4.11) */
  /* The photo intro and tab bar are a deep school green in both themes. */
  --night: #0f2e19; --night-2: #16402a; --night-muted: #a9c2b1; --night-text: #f1f5f2;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Outfit", var(--sans);
  /* Type scale, readable on small phones: page title 34-48px, section 22-28px, buttons and
     menus 16px, body 16px, dates and captions 14px, badges 13px. */
  --title: 700 clamp(34px, 2.5vw + 26px, 48px)/1.15 var(--display);
  --h2: 600 clamp(22px, 1vw + 18px, 28px)/1.25 var(--display);
  --ui: 16px;
  --small: 14px;
  --tiny: 13px;
  --measure: 65ch; /* comfortable line length for paragraphs */
  --radius: 12px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #8fd4a3; --text: #eef3ef; --muted: #a7b8ac;
    --bg: #0d1a12; --surface: #142619; --line: #24402c;
    --accent: #57b874; --accent-ink: #0b1f12;
    --lime-wash: #173322; --success: #57b874; --success-text: #8fd4a3; --highlight: #f5a623;
    --highlight-ink: #222222; --danger: #f2b8b5; --field-line: #6f9a7c;
  }
}
* { box-sizing: border-box; }
/* Author display rules (e.g. .btn's inline-flex) would otherwise unhide [hidden] elements. */
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 20px; border: 0; border-radius: var(--radius);
  background: var(--accent); color: var(--accent-ink);
  font: 600 var(--ui)/1 var(--display); text-decoration: none; cursor: pointer;
}
/* The one main action on a page, in the school's gold. */
.btn.cta { background: var(--cta); color: var(--cta-ink); }
@media (hover: hover) { .btn.cta:hover { background: var(--cta-hover); } }
.btn.ghost { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.btn:focus-visible, a:focus-visible, input:focus-visible, button:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
.banner { background: var(--lime-wash); color: var(--ink); font-size: var(--ui); padding: 10px 16px; text-align: center; }
.wordmark { display: inline-flex; align-items: center; gap: 10px; color: var(--accent);
  font: 700 clamp(26px, 5vw + 10px, 32px)/1.1 var(--display); letter-spacing: .02em; }
.wordmark img { flex: none; width: 48px; height: 48px; }
.tagline { margin: -2px 0 6px; color: var(--muted); font: italic 400 var(--small)/1.4 var(--sans); }
.eyebrow { color: var(--accent); font: 600 var(--small)/1.4 var(--sans); letter-spacing: .06em; text-transform: uppercase; }
h1 { font: var(--title); margin: 4px 0 8px; letter-spacing: -.01em; }
.center { min-height: 100svh; display: grid; place-items: center; padding: 32px 16px; text-align: center; }
.card { width: 100%; max-width: 420px; }
.muted { color: var(--muted); }
.helper { font-size: var(--small); color: var(--muted); }
/* Every guest page ends with a way to reach the school (its review, 2026-11-02). */
.feedback-link { margin: 0; padding: 16px 16px 32px; text-align: center; font-size: var(--small); }
.feedback-link a { display: inline-block; min-height: 44px; padding: 12px; color: var(--muted); }
/* Back links: a large tap target with an arrow, so they read as navigation on any phone. */
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: 0 0 8px;
  color: var(--accent); font: 600 var(--ui)/1.2 var(--sans); text-decoration: none; }
.back svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; }
.back:hover { text-decoration: underline; }
.back--night { color: var(--night-text); }
.footer { padding: 40px 16px 56px; text-align: center; color: var(--muted); font-size: var(--small); }
/* Tab bar: a deep green dock, the same in both themes so it also sits on the photo intro. */
body.has-nav { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.tabbar {
  position: fixed; z-index: 10; left: 50%; bottom: max(12px, env(safe-area-inset-bottom));
  transform: translateX(-50%); width: min(420px, calc(100% - 24px));
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px;
  background: rgba(11, 38, 16, .94); border: 1px solid rgba(255, 255, 255, .08); border-radius: 20px;
  box-shadow: 0 10px 30px rgba(4, 22, 10, .3);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.tabbar a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 52px; border-radius: 14px; color: var(--night-muted); text-decoration: none;
  font: 500 var(--tiny)/1 var(--sans); transition: color .15s, background-color .15s;
}
.tabbar a[aria-current="page"] { color: var(--accent-ink); background: var(--accent); font-weight: 600; }
@media (hover: hover) { .tabbar a:hover { color: #fff; } }
.tabbar a:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] svg { stroke-width: 2; }
.tab-icon { position: relative; display: inline-flex; }
.badge {
  position: absolute; top: -6px; left: 14px; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px; background: var(--highlight); color: var(--highlight-ink); font: 700 var(--tiny)/18px var(--sans); text-align: center;
}
{% block style %}{% endblock %}
</style>
</head>
<body{% block body_class %}{% endblock %}>
{% if is_preview %}<div class="banner" role="status">{% include "galleries/public/_preview_note.html" %}</div>{% endif %}
{% block body %}{% endblock %}
<script nonce="{{ csp_nonce }}">
// Installable app: the worker keeps only public files (see ops/pwa.py).
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
</script>
{% block feedback_link %}<p class="feedback-link"><a href="{% url 'feedback' %}?from={{ request.path|urlencode:'' }}">Send feedback</a></p>{% endblock %}
</body>
</html>
