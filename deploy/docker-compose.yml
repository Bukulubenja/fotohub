# FotoHub on one server (Johannesburg). Run from the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# See deploy/README.md for the first-time setup.

x-app: &app
  build: ..
  image: fotohub:latest
  env_file: .env
  environment:
    DATABASE_URL: postgres://fotohub:${POSTGRES_PASSWORD}@db:5432/fotohub
    CELERY_BROKER_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    CELERY_TASK_ALWAYS_EAGER: "false"
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

  web:
    <<: *app
    command: >-
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: celery -A config worker --concurrency=2 --loglevel=info

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fotohub
      POSTGRES_DB: fotohub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fotohub"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
