name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11; npm 10.8 trips over this dependency tree
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fotohub
          POSTGRES_PASSWORD: fotohub
          POSTGRES_DB: fotohub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fotohub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Postgres runs the row-lock tests that SQLite can't exercise.
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://fotohub:fotohub@localhost:5432/fotohub' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Postgres 17 client (backup/restore round trip)
        if: matrix.database == 'postgres'
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pytest --cov --cov-report=term-missing -rs

  docker:
    # The production image builds, boots against Postgres + Redis and reports healthy.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fotohub
          POSTGRES_PASSWORD: fotohub
          POSTGRES_DB: fotohub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fotohub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fotohub:ci .
      - name: Boot the image and check it
        env:
          APP_ENV: >-
            -e DJANGO_SECRET_KEY=ci-only-secret-key-that-is-long-enough-for-the-deploy-checks-123
            -e DJANGO_ALLOWED_HOSTS=localhost
            -e DATABASE_URL=postgres://fotohub:fotohub@localhost:5432/fotohub
            -e CACHE_URL=redis://localhost:6379/1
            -e CELERY_BROKER_URL=redis://localhost:6379/0
            -e BILLING_PROVIDER=flutterwave -e FLW_SECRET_KEY=x -e FLW_SECRET_HASH=x
            -e STORAGE_ACCESS_KEY_ID=x -e STORAGE_SECRET_ACCESS_KEY=x
        run: |
          docker run --rm --network host $APP_ENV fotohub:ci python manage.py migrate --noinput
          docker run --rm --network host $APP_ENV fotohub:ci python manage.py check --deploy
          docker run --rm --network host $APP_ENV fotohub:ci pg_dump --version
          docker run -d --name web --network host $APP_ENV fotohub:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz/ && break; sleep 2; done
          curl -fsS http://localhost:8000/healthz/ | grep '"database": "ok"'
          curl -fsS -H "X-Forwarded-Proto: https" http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS -H "X-Forwarded-Proto: https" http://localhost:8000/static/admin/css/base.css > /dev/null
          docker logs web
