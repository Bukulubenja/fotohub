name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11; npm 10.8 trips over this dependency tree
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fotohub
          POSTGRES_PASSWORD: fotohub
          POSTGRES_DB: fotohub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fotohub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Postgres runs the row-lock tests that SQLite can't exercise.
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://fotohub:fotohub@localhost:5432/fotohub' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: pytest --cov --cov-report=term-missing
